<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Shotwise Durable Batch control plane wireframe</title>
  <desc id="desc">A dark task HUD design showing durable batch status, progress, cancellation, retry failed items, and per-item task detail.</desc>
  <rect width="1440" height="960" fill="#11151b"/>
  <rect x="28" y="26" width="1384" height="908" rx="8" fill="#171d25" stroke="#303947"/>
  <rect x="28" y="26" width="1384" height="64" rx="8" fill="#1d2530"/>
  <rect x="28" y="82" width="1384" height="8" fill="#1d2530"/>
  <circle cx="62" cy="58" r="13" fill="#6c7cff"/>
  <path d="M56 58h12M62 52v12" stroke="#fff" stroke-width="2"/>
  <text x="88" y="64" fill="#f2f5f8" font-family="Arial,sans-serif" font-size="22" font-weight="700">Shotwise / Episode 01</text>
  <text x="1170" y="63" fill="#8d9aaa" font-family="Arial,sans-serif" font-size="14">Timeline · Task HUD</text>
  <rect x="58" y="118" width="850" height="760" rx="6" fill="#11161d" stroke="#2b3441"/>
  <text x="86" y="162" fill="#f2f5f8" font-family="Arial,sans-serif" font-size="26" font-weight="700">Timeline</text>
  <text x="86" y="190" fill="#8d9aaa" font-family="Arial,sans-serif" font-size="14">Batch actions stay beside the episode workflow</text>
  <rect x="86" y="222" width="252" height="42" rx="5" fill="#293348" stroke="#6579ff"/>
  <text x="106" y="249" fill="#dfe5ff" font-family="Arial,sans-serif" font-size="14" font-weight="700">Generate storyboards</text>
  <rect x="350" y="222" width="212" height="42" rx="5" fill="#202832" stroke="#3d4a59"/>
  <text x="373" y="249" fill="#c5ced8" font-family="Arial,sans-serif" font-size="14">Generate videos</text>
  <rect x="574" y="222" width="212" height="42" rx="5" fill="#202832" stroke="#3d4a59"/>
  <text x="598" y="249" fill="#c5ced8" font-family="Arial,sans-serif" font-size="14">Generate narration</text>
  <line x1="86" y1="304" x2="878" y2="304" stroke="#2b3441"/>
  <text x="86" y="346" fill="#748092" font-family="Arial,sans-serif" font-size="12" font-weight="700">SHOT LIST</text>
  <text x="730" y="346" fill="#748092" font-family="Arial,sans-serif" font-size="12">MEDIA STATE</text>
  <g font-family="Arial,sans-serif" font-size="15">
    <rect x="86" y="372" width="792" height="78" rx="4" fill="#1a222c" stroke="#2e3947"/>
    <text x="108" y="405" fill="#e4e9ee">SEG-001</text><text x="108" y="429" fill="#8d9aaa" font-size="13">A lantern crosses the empty corridor</text>
    <rect x="730" y="396" width="112" height="27" rx="14" fill="#273449"/><circle cx="746" cy="410" r="5" fill="#6c7cff"/><text x="760" y="415" fill="#bfcaff" font-size="12">queued</text>
    <rect x="86" y="466" width="792" height="78" rx="4" fill="#1a222c" stroke="#2e3947"/>
    <text x="108" y="499" fill="#e4e9ee">SEG-002</text><text x="108" y="523" fill="#8d9aaa" font-size="13">A door opens into blue morning light</text>
    <rect x="730" y="490" width="112" height="27" rx="14" fill="#263628"/><circle cx="746" cy="504" r="5" fill="#6bd18a"/><text x="760" y="509" fill="#b7e6c2" font-size="12">ready</text>
    <rect x="86" y="560" width="792" height="78" rx="4" fill="#1a222c" stroke="#2e3947"/>
    <text x="108" y="593" fill="#e4e9ee">SEG-003</text><text x="108" y="617" fill="#8d9aaa" font-size="13">The room stays still after the footsteps</text>
    <rect x="730" y="584" width="112" height="27" rx="14" fill="#3a3024"/><circle cx="746" cy="598" r="5" fill="#e2ad5d"/><text x="760" y="603" fill="#f1c98e" font-size="12">failed</text>
  </g>
  <rect x="86" y="692" width="792" height="128" rx="5" fill="#151b23" stroke="#2b3441" stroke-dasharray="5 5"/>
  <text x="112" y="730" fill="#748092" font-family="Arial,sans-serif" font-size="13">Empty space remains available for the next timeline rows</text>
  <text x="112" y="758" fill="#536071" font-family="Arial,sans-serif" font-size="12">No extra page or modal is required to start a batch.</text>

  <rect x="936" y="118" width="438" height="760" rx="6" fill="#151b23" stroke="#394656"/>
  <rect x="936" y="118" width="438" height="78" rx="6" fill="#1d2631"/>
  <rect x="936" y="188" width="438" height="8" fill="#1d2631"/>
  <rect x="966" y="139" width="34" height="34" rx="5" fill="#2d3855"/>
  <rect x="976" y="148" width="14" height="16" fill="none" stroke="#9aa9ff" stroke-width="2"/>
  <text x="1016" y="153" fill="#f2f5f8" font-family="Arial,sans-serif" font-size="16" font-weight="700">Durable batches</text>
  <text x="1016" y="176" fill="#8d9aaa" font-family="Arial,sans-serif" font-size="12">Persisted control plane · 2 tracked</text>
  <rect x="1257" y="143" width="91" height="29" rx="14" fill="#273449"/><circle cx="1273" cy="157" r="5" fill="#6c7cff"/><text x="1285" y="162" fill="#c4ceff" font-family="Arial,sans-serif" font-size="12">active</text>
  <rect x="966" y="218" width="378" height="202" rx="5" fill="#1a222c" stroke="#394656"/>
  <text x="988" y="249" fill="#e4e9ee" font-family="Arial,sans-serif" font-size="15" font-weight="700">Batch · running</text>
  <text x="988" y="274" fill="#748092" font-family="monospace" font-size="12">b_01H9...7K2P</text>
  <text x="1260" y="274" fill="#e4e9ee" font-family="monospace" font-size="13">2 / 3</text>
  <rect x="988" y="294" width="334" height="6" rx="3" fill="#2a3441"/><rect x="988" y="294" width="223" height="6" rx="3" fill="#6c7cff"/>
  <text x="988" y="326" fill="#8d9aaa" font-family="Arial,sans-serif" font-size="12">Succeeded 2</text><text x="1085" y="326" fill="#e2ad5d" font-family="Arial,sans-serif" font-size="12">Failed 1</text><text x="1170" y="326" fill="#8d9aaa" font-family="Arial,sans-serif" font-size="12">Active 0</text>
  <rect x="988" y="348" width="136" height="34" rx="4" fill="#3a3024" stroke="#725b37"/><text x="1010" y="370" fill="#f1c98e" font-family="Arial,sans-serif" font-size="12">Retry failed</text>
  <rect x="1134" y="348" width="112" height="34" rx="4" fill="#202832" stroke="#3d4a59"/><text x="1157" y="370" fill="#c5ced8" font-family="Arial,sans-serif" font-size="12">Copy ID</text>
  <rect x="966" y="440" width="378" height="202" rx="5" fill="#1a222c" stroke="#394656"/>
  <text x="988" y="471" fill="#e4e9ee" font-family="Arial,sans-serif" font-size="15" font-weight="700">Batch · partially succeeded</text>
  <text x="988" y="496" fill="#748092" font-family="monospace" font-size="12">b_01H8...2M0A</text>
  <rect x="988" y="516" width="334" height="6" rx="3" fill="#2a3441"/><rect x="988" y="516" width="167" height="6" rx="3" fill="#e2ad5d"/>
  <text x="988" y="548" fill="#8d9aaa" font-family="Arial,sans-serif" font-size="12">Succeeded 4</text><text x="1085" y="548" fill="#e2ad5d" font-family="Arial,sans-serif" font-size="12">Failed 2</text><text x="1170" y="548" fill="#8d9aaa" font-family="Arial,sans-serif" font-size="12">Cancelled 0</text>
  <rect x="988" y="570" width="160" height="34" rx="4" fill="#3a3024" stroke="#725b37"/><text x="1010" y="592" fill="#f1c98e" font-family="Arial,sans-serif" font-size="12">Retry failed items</text>
  <rect x="966" y="664" width="378" height="184" rx="5" fill="#11161d" stroke="#2b3441"/>
  <text x="988" y="696" fill="#748092" font-family="Arial,sans-serif" font-size="12" font-weight="700">EXPANDED TASK DETAILS</text>
  <text x="988" y="730" fill="#e4e9ee" font-family="monospace" font-size="12">✓ SEG-001   t_91af... queued</text>
  <text x="988" y="760" fill="#e4e9ee" font-family="monospace" font-size="12">✓ SEG-002   t_91b0... succeeded</text>
  <text x="988" y="790" fill="#f1c98e" font-family="monospace" font-size="12">× SEG-003   t_91b1... failed</text>
  <text x="988" y="820" fill="#536071" font-family="Arial,sans-serif" font-size="11">Cancel cascades only to active tasks.</text>
  <text x="58" y="915" fill="#657284" font-family="Arial,sans-serif" font-size="12">Design intent: batch identity and lifecycle stay visible without interrupting the timeline workflow.</text>
</svg>
